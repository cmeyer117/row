<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Carl's Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { margin: 0; background: #080808; color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  form { width: 100%; max-width: 340px; padding: 36px 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; font-weight: 700; margin: 0; }
  input { padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.07); color: #FAFAFA; font-size: 14px; }
  button { padding: 12px; border-radius: 12px; border: 0; background: #FAFAFA; color: #0A0A0B; font-size: 14px; font-weight: 700; cursor: pointer; }
  #msg { font-size: 12px; display: none; }
  #msg.err { color: #FF6B6B; }
  #msg.ok { color: #6EE7B7; }
</style>
</head>
<body>
<form id="rp-form">
  <h1>Set a new password</h1>
  <input id="rp-pass" type="password" placeholder="New password" autocomplete="new-password" minlength="8">
  <div id="msg"></div>
  <button type="submit">Save password</button>
</form>
<script>
(function () {
  'use strict';
  const SUPABASE_URL = window.SUPABASE_CONFIG.URL;
  const SUPABASE_KEY = window.SUPABASE_CONFIG.KEY;
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const msg = document.getElementById('msg');

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = ok ? 'ok' : 'err';
    msg.style.display = 'block';
  }

  document.getElementById('rp-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const pass = document.getElementById('rp-pass').value;
    if (pass.length < 8) { showMsg('Password must be at least 8 characters.', false); return; }
    // Supabase JS auto-detects the recovery token from the URL hash on page
    // load (detectSessionInUrl, default true) and turns it into a real
    // session -- updateUser() below just needs that session to already
    // exist, which it does by the time this handler can even run.
    const { error } = await supa.auth.updateUser({ password: pass });
    if (error) { showMsg(error.message, false); return; }
    showMsg('Password updated — you can close this tab and sign in on any Row page now.', true);
    document.getElementById('rp-form').querySelector('button').disabled = true;
  });
})();
</script>
</body>
</html>
