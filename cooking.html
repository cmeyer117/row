<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Row" />
<title>Cooking Coach — Row</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="row-auth.js" defer></script>
<script src="topbar.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staple-foods.js"></script>
<script src="cooking-coach-data.js"></script>
<script src="coach-meal-plan.js"></script>
<script src="macro-calc.js"></script>
<script src="gym-workout-events.js"></script>
<script src="training-insight-engine.js"></script>
<script src="cooking-coach-suggestions.js"></script>
<style>
:root {
  --bg: #000000;
  --bg-card: #111113;
  --text-1: #F4F1EA;
  --text-2: rgba(244,241,234,0.6);
  --text-3: rgba(244,241,234,0.4);
  --text-4: rgba(244,241,234,0.25);
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --accent: #6ee7b7;
  --good: #6ee7b7;
  --warn: #fbbf24;
  --bad: #ff8a8a;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: radial-gradient(ellipse 80% 60% at 75% 0%, rgba(110,231,183,0.06) 0%, #0a0a0b 60%);
  color: var(--text-1);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}
.cc-shell {
  width: 100%; max-width: min(720px, 100vw);
  margin: 0 auto;
  padding: 24px 16px calc(120px + env(safe-area-inset-bottom));
  box-sizing: border-box;
}
.cc-shell * { min-width: 0; }
.cc-header { margin-bottom: 20px; }
.cc-title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
.cc-subtitle { font-size: 12px; color: var(--text-3); margin: 2px 0 0; }

.cc-section-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3);
  margin: 24px 0 12px;
}
.cc-section-label:first-child { margin-top: 0; }

.cc-meal-card {
  background: rgba(255,255,255,0.025); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 18px; margin-bottom: 10px;
}
.cc-meal-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.cc-meal-build { font-size: 12px; color: var(--text-2); line-height: 1.5; margin-bottom: 10px; }
.cc-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.cc-chip {
  padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
  color: var(--text-1); background: rgba(255,255,255,0.05);
  border: 1px solid var(--border); cursor: pointer;
  -webkit-tap-highlight-color: transparent; font-family: inherit;
  transition: background 0.15s, border-color 0.15s;
}
.cc-chip:hover { background: rgba(110,231,183,0.10); border-color: rgba(110,231,183,0.30); }

.cc-staple-list { display: flex; flex-direction: column; gap: 6px; }
.cc-staple-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; background: rgba(255,255,255,0.025);
  border: 1px solid var(--border); border-radius: 10px;
  font-size: 13px; font-weight: 600; color: var(--text-1);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  font-family: inherit; text-align: left; width: 100%;
}
.cc-staple-row:hover { background: rgba(110,231,183,0.06); }
.cc-staple-arrow { color: var(--text-3); }

.cc-modal-bg {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  align-items: center; justify-content: center; padding: 20px; z-index: 100;
}
.cc-modal-bg.show { display: flex; }
.cc-modal {
  background: #141416; border-radius: 16px; padding: 20px; width: 100%; max-width: 420px;
  max-height: 88vh; overflow-y: auto;
}
.cc-modal-title { font-size: 17px; font-weight: 700; margin: 0 0 10px; }
.cc-modal-row { margin-bottom: 12px; }
.cc-modal-row-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.10em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 4px;
}
.cc-modal-row-body { font-size: 13px; color: var(--text-2); line-height: 1.5; }
.cc-modal-steps { margin: 0; padding-left: 18px; }
.cc-modal-steps li { margin-bottom: 4px; }
.cc-modal-mistake {
  background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.2);
  border-radius: 12px; padding: 10px 14px; font-size: 12px; color: var(--warn); line-height: 1.5;
}
.cc-modal-close {
  margin-top: 16px; width: 100%; padding: 12px; border-radius: 10px; border: none;
  font-weight: 700; cursor: pointer; background: rgba(255,255,255,0.08); color: #FAFAFA;
}

/* ── Gym tab bar (shared with gym.html / mobility.html / posing.html) ── */
.gym-tabbar {
  position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 60;
  display: flex; justify-content: center;
  padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(5,5,6,0) 0%, rgba(5,5,6,0.82) 40%, rgba(5,5,6,0.96) 100%);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  pointer-events: none;
}
.gym-tabbar-inner {
  pointer-events: auto;
  display: flex; width: 100%; max-width: 400px; gap: 6px;
  padding: 6px; background: rgba(20,20,22,0.72);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
  box-shadow: 0 12px 36px rgba(0,0,0,0.55);
}
.gym-tab {
  flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 14px; border-radius: 13px; font-size: 14px; font-weight: 600;
  letter-spacing: 0.01em; color: var(--text-3); background: transparent;
  border: 1px solid transparent; cursor: pointer; text-decoration: none;
  transition: color 0.15s, background 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent; font-family: var(--font);
}
.gym-tab:hover { color: var(--text-1); }
.gym-tab.active {
  color: var(--text-1); background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.10);
}
@media (max-width: 400px) {
  .gym-tab { padding: 11px 10px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="cc-shell">
  <div class="cc-header">
    <h1 class="cc-title">Cooking Coach</h1>
    <p class="cc-subtitle" id="ccPhase"></p>
    <p class="cc-subtitle">Salt (Himalayan pink or kosher) goes on everything — each card's Seasoning row is what to add beyond that.</p>
  </div>

  <div class="cc-section-label" id="ccSwapLabel" style="display:none;">Today's Swap</div>
  <div id="ccSwaps"></div>

  <div class="cc-section-label">My Meal Plan</div>
  <div id="ccMealPlan"></div>

  <div class="cc-section-label">All Staple Foods</div>
  <div class="cc-staple-list" id="ccStapleList"></div>
</div>

<div class="cc-modal-bg" id="ccModalBg">
  <div class="cc-modal">
    <h3 class="cc-modal-title" id="ccModalTitle"></h3>
    <div class="cc-modal-row">
      <div class="cc-modal-row-label">Method</div>
      <div class="cc-modal-row-body" id="ccModalMethod"></div>
    </div>
    <div class="cc-modal-row">
      <div class="cc-modal-row-label">Temp / Time</div>
      <div class="cc-modal-row-body" id="ccModalTempTime"></div>
    </div>
    <div class="cc-modal-row">
      <div class="cc-modal-row-label">Steps</div>
      <ul class="cc-modal-steps" id="ccModalSteps"></ul>
    </div>
    <div class="cc-modal-row">
      <div class="cc-modal-row-label">Seasoning (beyond salt)</div>
      <div class="cc-modal-row-body" id="ccModalSeasoning"></div>
    </div>
    <div class="cc-modal-row">
      <div class="cc-modal-row-label">Key Tip</div>
      <div class="cc-modal-row-body" id="ccModalKeyTip"></div>
    </div>
    <div class="cc-modal-mistake" id="ccModalMistake"></div>
    <button class="cc-modal-close" id="ccModalCloseBtn" type="button">Close</button>
  </div>
</div>

<!-- Gym tab bar — Cooking Coach active (Health section) -->
<nav class="gym-tabbar">
  <div class="gym-tabbar-inner">
    <a class="gym-tab" href="health.html">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 14s-5.5-3.4-5.5-7.2C2.5 4.5 4.2 3 6 3c.9 0 1.7.4 2 1.1C8.3 3.4 9.1 3 10 3c1.8 0 3.5 1.5 3.5 3.8C13.5 10.6 8 14 8 14z" fill="currentColor"/></svg>
      Health
    </a>
    <a class="gym-tab active" href="cooking.html">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7h10a1 1 0 011 1v1a1 1 0 01-1 1H3a1 1 0 01-1-1V8a1 1 0 011-1z" fill="currentColor"/><path d="M4 7V4.5a1.5 1.5 0 013 0V7M7 7V3a1 1 0 012 0v4M10 7V4.5a1.5 1.5 0 013 0V7" stroke="currentColor" stroke-width="1" fill="none"/><path d="M4 10v2a2 2 0 002 2h4a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      Cooking Coach
    </a>
  </div>
</nav>

<script>
(function () {
  var MEAL_PLAN = window.CookingCoach.MEAL_PLAN;
  var COOKING_GUIDES = window.CookingCoach.COOKING_GUIDES;
  var FOODS = window.StapleFoods.FOODS;

  function $(id) { return document.getElementById(id); }

  function renderMealPlan() {
    $('ccPhase').textContent = MEAL_PLAN.phase;
    var wrap = $('ccMealPlan');
    wrap.innerHTML = '';
    MEAL_PLAN.meals.forEach(function (meal) {
      var card = document.createElement('div');
      card.className = 'cc-meal-card';

      var label = document.createElement('div');
      label.className = 'cc-meal-label';
      label.textContent = meal.label;

      var build = document.createElement('div');
      build.className = 'cc-meal-build';
      build.textContent = meal.build;

      var chipRow = document.createElement('div');
      chipRow.className = 'cc-chip-row';
      meal.foods.forEach(function (foodName) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'cc-chip';
        chip.textContent = foodName;
        chip.addEventListener('click', function () { openGuideModal(foodName); });
        chipRow.appendChild(chip);
      });

      card.appendChild(label);
      card.appendChild(build);
      card.appendChild(chipRow);
      wrap.appendChild(card);
    });
  }

  function renderStapleList() {
    var list = $('ccStapleList');
    list.innerHTML = '';
    FOODS
      .filter(function (f) { return Object.prototype.hasOwnProperty.call(COOKING_GUIDES, f.name); })
      .slice()
      .sort(function (a, b) { return a.name.localeCompare(b.name); })
      .forEach(function (f) {
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'cc-staple-row';
        row.addEventListener('click', function () { openGuideModal(f.name); });

        var name = document.createElement('span');
        name.textContent = f.name;
        var arrow = document.createElement('span');
        arrow.className = 'cc-staple-arrow';
        arrow.textContent = '›';

        row.appendChild(name);
        row.appendChild(arrow);
        list.appendChild(row);
      });
  }

  function openGuideModal(foodName) {
    var guide = COOKING_GUIDES[foodName];
    if (!guide) return;
    $('ccModalTitle').textContent = foodName;
    $('ccModalMethod').textContent = guide.method;
    $('ccModalTempTime').textContent = guide.tempTime;
    var stepsList = $('ccModalSteps');
    stepsList.innerHTML = '';
    guide.steps.forEach(function (step) {
      var li = document.createElement('li');
      li.textContent = step;
      stepsList.appendChild(li);
    });
    $('ccModalSeasoning').textContent = guide.seasoning;
    $('ccModalKeyTip').textContent = guide.keyTip;
    $('ccModalMistake').textContent = '⚠️ ' + guide.mistake;
    $('ccModalBg').classList.add('show');
  }
  function closeGuideModal() { $('ccModalBg').classList.remove('show'); }

  $('ccModalCloseBtn').addEventListener('click', closeGuideModal);
  $('ccModalBg').addEventListener('click', function (e) {
    if (e.target === $('ccModalBg')) closeGuideModal();
  });

  // -- Today's Swap: real food_log data against remaining macro budget.
  // Same localStorage targets key + Supabase food_log read as macros.html
  // (LS_KEY/SUPABASE_URL/SUPABASE_KEY copied 1:1 -- two separate static
  // pages, no shared module to import them from).
  var LS_KEY = 'macro_targets';
  var DEFAULT_TARGETS = { proteinG: 280, carbG: 397, fatG: 58, calories: 3201 };
  var SUPABASE_URL = 'https://vikpcejlyxieguorwysf.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_EvWPtfW1FBW5Vf-H6w0yHw_PcXK4imv';
  var supa = null;
  function getSupa() {
    if (!supa && window.supabase) supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return supa;
  }
  function loadTargets() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return Object.assign({}, DEFAULT_TARGETS);
      return Object.assign({}, DEFAULT_TARGETS, JSON.parse(raw));
    } catch (e) { return Object.assign({}, DEFAULT_TARGETS); }
  }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  async function fetchTodayEntries() {
    var client = getSupa();
    if (!client) return null; // Supabase not ready -- treated as missing data, not zero consumption
    var res = await client.from('food_log').select('*').eq('log_date', todayKey());
    if (res.error) return null;
    return res.data || [];
  }

  // Recovery-signal note (item 2.5): reuses the exact sleep-deviation +
  // performance-stall signal weekly-review.html already computes via
  // TrainingInsightEngine -- this just re-runs the same pure detector
  // against the same two app_state keys (po-coach is anon-readable per
  // fetchGymState's pattern there; health is owner-RLS, needs the real
  // JWT like fetchAppStateKey there). Never throws -- any fetch failure
  // just means no recovery note today, not a broken swap list.
  // Codex review 2026-08-21: a stalled (not rejected) request on either
  // fetch below used to leave this promise pending forever -- since
  // fetchRecoverySignal() is one leg of a Promise.all with the swap
  // suggestions, that hung the whole cooking-suggestions render, not just
  // the recovery note. 4s timeout degrades to the same "no recovery note"
  // outcome a real failure already produces.
  function fetchWithTimeout(url, opts, ms) {
    var ac = new AbortController();
    var timer = setTimeout(function () { ac.abort(); }, ms);
    return fetch(url, Object.assign({}, opts, { signal: ac.signal })).finally(function () { clearTimeout(timer); });
  }

  async function fetchRecoverySignal() {
    try {
      if (!window.TrainingInsightEngine || !window.GymWorkoutEvents) return null;
      var gymRes = await fetchWithTimeout(SUPABASE_URL + '/rest/v1/app_state?key=eq.po-coach&select=data', {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
      }, 4000);
      var gymRows = await gymRes.json();
      var gymData = (gymRows[0] && gymRows[0].data && gymRows[0].data.po_coach_v1) || { exercises: [], logs: {} };

      var token = window.RowAuth ? await window.RowAuth.getAccessToken() : null;
      if (!token) return null;
      var healthRes = await fetchWithTimeout(SUPABASE_URL + '/rest/v1/app_state?key=eq.health&select=data', {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + token },
      }, 4000);
      if (!healthRes.ok) return null;
      var healthRows = await healthRes.json();
      var healthData = (healthRows[0] && healthRows[0].data) || null;
      var sleepEntries = ((healthData && healthData['health:sleep']) || []).filter(function (e) { return e && e.date && e.hours != null; });

      var exercisesById = {};
      (gymData.exercises || []).forEach(function (ex) { exercisesById[ex.id] = ex; });
      var exposuresByName = {};
      Object.keys(gymData.logs || {}).forEach(function (exId) {
        var ex = exercisesById[exId];
        if (!ex) return;
        var entries = (gymData.logs[exId] || []).map(function (l) {
          return {
            date: (l.date || '').slice(0, 10),
            load: ex.bw ? l.reps : window.GymWorkoutEvents.totalLoad(l, ex),
            reps: l.reps,
            variantTag: l.variant || null,
          };
        }).filter(function (e) { return e.date && e.load != null; });
        if (entries.length) exposuresByName[ex.name] = entries;
      });

      var findings = window.TrainingInsightEngine.runInsightEngine({
        exercises: exposuresByName,
        sleepEntries: sleepEntries,
        now: new Date(),
      });
      var recovery = findings.filter(function (f) { return f.type === 'recovery-signal'; })[0];
      return recovery || null;
    } catch (e) {
      return null;
    }
  }

  function renderSwaps(suggestions) {
    var label = $('ccSwapLabel');
    var wrap = $('ccSwaps');
    wrap.innerHTML = '';
    if (!suggestions.length && !suggestions.recoveryNote) { label.style.display = 'none'; return; }
    label.style.display = '';
    if (suggestions.recoveryNote) {
      var noteCard = document.createElement('div');
      noteCard.className = 'cc-meal-card';
      noteCard.textContent = suggestions.recoveryNote;
      wrap.appendChild(noteCard);
    }
    suggestions.forEach(function (s) {
      var card = document.createElement('div');
      card.className = 'cc-meal-card';

      var head = document.createElement('div');
      head.className = 'cc-meal-label';
      head.textContent = s.slotLabel + ' — ' + Math.round(s.gapProteinG) + 'g protein short today';

      var body = document.createElement('div');
      body.className = 'cc-meal-build';
      var m = s.swapMacros;
      body.textContent = 'Swap in ' + s.swapLabel + ' (' + Math.round(m.protein_g) + 'p / ' +
        Math.round(m.carb_g) + 'c / ' + Math.round(m.fat_g) + 'f — ' + Math.round(m.calories) + 'cal) to close the gap.';

      card.appendChild(head);
      card.appendChild(body);
      wrap.appendChild(card);
    });
  }

  async function renderTodaySwap() {
    if (!window.CoachMealPlan || !window.CookingCoachSuggestions || !window.MacroCalc) return;
    var results = await Promise.all([fetchTodayEntries(), fetchRecoverySignal()]);
    var entries = results[0], recoverySignal = results[1];
    var suggestions = window.CookingCoachSuggestions.suggestMealSwaps(loadTargets(), entries, window.CoachMealPlan.MEALS, FOODS, recoverySignal);
    renderSwaps(suggestions);
  }

  renderMealPlan();
  renderStapleList();
  renderTodaySwap();
})();
</script>
</body>
</html>
