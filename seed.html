<!DOCTYPE html>
<html lang="en">

  ];
  const existing = JSON.parse(localStorage.getItem(WT_KEY) || '[]');
  const existingKeys = new Set(existing.map(e => e.dateKey));
  const merged = existing.concat(seed.filter(e => !existingKeys.has(e.dateKey)));
  merged.sort((a, b) => a.dateKey.localeCompare(b.dateKey));
  localStorage.setItem(WT_KEY, JSON.stringify(merged));

  // ── 2. Exercise starting weights ──────────────────────────────────────────

  const weightMap = {
    'Neutral Grip Shoulder Press Machine': 185,
    'Smith Machine Flat Chest Press':      250,
    'Incline Cable Pec Fly':               52.5,
    'Dumbbell Lateral Raise':              35,

  try {
    const gymRaw = localStorage.getItem(GYM_KEY);
    if (gymRaw) {
      const gymState = JSON.parse(gymRaw);
      if (Array.isArray(gymState.exercises)) {
        gymState.exercises.forEach(ex => {
          if (weightMap[ex.name] !== undefined) ex.startWeight = weightMap[ex.name];
        });
        localStorage.setItem(GYM_KEY, JSON.stringify(gymState));
      }
    }
  } catch (e) {}

  // ── Done ──────────────────────────────────────────────────────────────────
  document.getElementById('msg').textContent = '✓ Done — ' + merged.length + ' weight entries seeded';
  document.getElementById('sub').textContent = 'Redirecting to gym…';
  setTimeout(() => { window.location.href = 'gym.html'; }, 1200);
})();
</script>
</body>
</html>
