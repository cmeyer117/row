<style>
:root {
  --bg: #000000;
  --bg-card: #111113;
  --text-1: #F4F1EA;
  --text-2: rgba(244,241,234,0.6);
  --text-3: rgba(244,241,234,0.4);
  --text-4: rgba(244,241,234,0.25);
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --accent: #6ee7b7;
  --good: #6ee7b7;
  --warn: #fbbf24;
  --bad: #ff8a8a;

  margin: 0; padding: 0;

  color: var(--text-1);

  background: var(--bg-card); color: var(--text-1); border: 1px solid var(--border);
  border-radius: 8px; font-family: var(--font); font-size: 13px;
}
button {
  background: var(--accent); color: #06120c; border: none; border-radius: 8px;
  font-family: var(--font); font-weight: 600; cursor: pointer;
}

<body>
<div id="app" style="max-width:640px;margin:0 auto;padding:24px 16px 100px;">
  <h1 style="font-family:var(--font);font-size:22px;color:var(--text-1);">Weekly Coach Decision Loop</h1>
  <div id="loading" style="color:var(--text-3);">Loading...</div>
  <div id="readinessSection" style="display:none;"></div>
  <div id="closeoutSection" style="display:none;"></div>
  <div id="newDecisionSection" style="display:none;"></div>
</div>
<script>
const MUSCLES = Object.keys(window.GymVolumeLogic.MUSCLE_BANDS);

// Memoized: the closeout flow and the immediately-following new-decision
// form both need this same po-coach row within one page load, and nothing
// on this page logs a set in between (found in code review 2026-08-17 —
// was 2 identical Supabase round-trips back to back on the common path).
let _gymStatePromise = null;
async function fetchGymState() {
  if (_gymStatePromise) return _gymStatePromise;
  _gymStatePromise = (async () => {
    const res = await fetch('https://vikpcejlyxieguorwysf.supabase.co/rest/v1/app_state?key=eq.po-coach&select=data', {
      headers: {
        apikey: window.SUPABASE_CONFIG.KEY,
        Authorization: 'Bearer ' + window.SUPABASE_CONFIG.KEY,
      },
    });
    const rows = await res.json();
    const data = rows[0] && rows[0].data;
    const base = (data && data.po_coach_v1) || { exercises: [], logs: {} };
    // po_coach_season/po_coach_weights are sibling keys to po_coach_v1
    // within the same app_state row (see gym.html's PC_SYNCED_KEYS), not
    // nested inside it -- merge them in so callers get everything from one
    // fetch. checkins/jointPain are already inside po_coach_v1 itself.
    return Object.assign({}, base, {
      season: (data && data.po_coach_season) || null,
      weights: (data && data.po_coach_weights) || [],
    });
  })();
  return _gymStatePromise;
}

// food_log is owner-RLS scoped (see fetchAppStateKey's comment below) --
// needs the real owner JWT, not the anon key. Returns this week's rows
// (inclusive Monday-Sunday), or [] on any failure/no session.
async function fetchFoodLogWeek(monday, sunday) {
  try {
    const token = await window.RowAuth.getAccessToken();
    const res = await fetch(
      'https://vikpcejlyxieguorwysf.supabase.co/rest/v1/food_log?log_date=gte.' + monday + '&log_date=lte.' + sunday + '&select=*',
      { headers: { apikey: window.SUPABASE_CONFIG.KEY, Authorization: 'Bearer ' + token } }
    );
    if (!res.ok) return [];
    return await res.json();
  } catch {
    return [];
  }
}

async function fetchCoachRead() {
  try {
    const token = await window.RowAuth.getAccessToken();
    const res = await fetch('/api/coach-read', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) return null;
    const body = await res.json();
    return body.coachRead;
  } catch {
    return null;
  }
}

// 'health' and 'posing' are owner-only RLS-scoped app_state keys (unlike
// 'po-coach', which is on the anon-readable allowlist), so fetchGymState's
// raw anon-key request wouldn't work here. Unlike fetchCoachRead (which
// proxies through /api/coach-read, a server route that authenticates the
// caller then reads Supabase itself with the service-role key), this sends
// the client's own owner JWT directly to Supabase's REST endpoint — same
// request shape fetchGymState uses, but with a real per-user token instead
// of the anon key, since RLS on these two keys requires it.
async function fetchAppStateKey(key) {
  try {
    const token = await window.RowAuth.getAccessToken();
    const res = await fetch('https://vikpcejlyxieguorwysf.supabase.co/rest/v1/app_state?key=eq.' + key + '&select=data', {
      headers: {
        apikey: window.SUPABASE_CONFIG.KEY,
        Authorization: 'Bearer ' + token,
      },
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return (rows[0] && rows[0].data) || null;
  } catch {
    return null;
  }
}

// Monday/Sunday (YYYY-MM-DD) of the week containing refDate, using the same
// Monday-of-week convention gym-volume-logic.js already establishes.
function weekWindow(refDate) {
  const monday = window.GymVolumeLogic.mondayOfDate(refDate);
  const sunday = new Date(monday + 'T00:00:00.000Z');
  sunday.setUTCDate(sunday.getUTCDate() + 6);
  return { monday, sunday: sunday.toISOString().slice(0, 10) };
}

function countEntriesInWeek(entries, monday, sunday) {
  return (entries || []).filter(e => e && e.date && e.date >= monday && e.date <= sunday).length;
}

// gym-volume-logic.js's mondayOfDate() buckets by UTC calendar day. Carl's
// real local day is America/New_York (see api/_lib/workout-nudge-logic.js) --
// a decision recorded Sunday evening Eastern (after ~7-8pm, once the UTC
// date has already rolled to Monday) would otherwise get bucketed a full
// week later than the week Carl actually reviewed (found in code review
// 2026-08-17: this is literally the weekly-review page, Sunday evening is
// a plausible time to use it). Converts to Carl's local calendar date
// first so mondayOfDate() reads the weekday he actually experienced.
function easternCalendarDate(date) {
  const ymd = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
  return new Date(ymd + 'T00:00:00.000Z');
}

// Builds the auto-computed follow-through scorecard for the week the
// decision governed (the 7 days starting the Monday after it was made —
// review_date is created_at + 7 days, so this lands on the same week
// Carl is actually reviewing). Volume gets a real matched/not-matched call
// against the baseline captured at decision time; cardio/posing surface
// raw counts as context next to the free-text prescription, since there's
// no structured target to check them against. Anchor-lift and pain stay
// fully manual (2026-08-17: no reliable structured target exists for
// either — deliberately not attempting free-text matching against lift
// names for a v1).
// 3-state auto verdict for a numeric weekly target (cardio/posing session
// counts) -- same idea as matchesVolumeDecision but for a plain "actual vs
// target" comparison instead of a directional action. null target means no
// structured Rx was set (legacy free-text decision), so no verdict to give.
function matchesCountTarget(target, actual) {
  if (target == null) return null;
  if (actual >= target) return 'matched';
  if (actual === 0) return 'not_matched';
  return 'partly_matched';
}

// Pre-fix decisions stored cardio_rx/posing_rx as a bare prescription string
// -- degrade gracefully instead of crashing on old rows.
function rxInfo(entry, actual) {
  if (!entry || typeof entry !== 'object') return { legacyText: entry || null, target: null, guardrail: null, actual, verdict: null };
  const target = typeof entry.target === 'number' ? entry.target : null;
  return { legacyText: null, target, guardrail: entry.guardrail || null, actual, verdict: matchesCountTarget(target, actual) };
}

// One-line display for the readiness panel's Rx summary -- handles both the
// legacy bare string and the new {target, guardrail} shape.
function rxSummaryText(entry) {
  if (!entry || typeof entry !== 'object') return entry;
  const parts = [];
  if (entry.target != null) parts.push(entry.target + 'x/wk');
  if (entry.guardrail) parts.push(entry.guardrail);
  return parts.length ? parts.join(' — ') : '(no target set)';
}

// The new {target, guardrail} shape is always a truthy object even when
// both fields are blank, unlike the legacy bare string (empty = falsy) --
// so callers deciding whether to show a Rx line need this instead of a
// plain truthiness check on the raw value.
function hasRx(entry) {
  if (!entry) return false;
  if (typeof entry !== 'object') return true;
  return entry.target != null || !!entry.guardrail;
}

// Builds the optional coach_response detail entry for a closeout save --
// null (omitted from details entirely) when both fields are blank, so an
// old decision closed out before this feature shipped and a new one with
// no coach check-in that week look identical (no dangling empty object).
function buildCoachResponse(status, note) {
  const trimmedNote = (note || '').trim();
  if (!status && !trimmedNote) return null;
  return { status: status || null, note: trimmedNote || null };
}

async function computeScorecard(decision) {
  const scoreWeekRef = easternCalendarDate(new Date(decision.created_at));
  scoreWeekRef.setUTCDate(scoreWeekRef.getUTCDate() + 7);
  const { monday, sunday } = weekWindow(scoreWeekRef);

  const [gymState, health, posing] = await Promise.all([
    fetchGymState(),
    fetchAppStateKey('health'),
    fetchAppStateKey('posing'),
  ]);

  const actualCounts = window.GymVolumeLogic.weeklySetsByMuscle(gymState.exercises || [], gymState.logs || {}, scoreWeekRef);
  const muscleGroups = (decision.details && decision.details.muscle_groups) || {};
  const volumeRows = Object.keys(muscleGroups).map(m => {
    const entry = muscleGroups[m];
    // Pre-fix decisions stored a bare action string, not {action, baseline} — degrade
    // gracefully instead of crashing on old rows.
    const action = entry && typeof entry === 'object' ? entry.action : entry;
    const baseline = entry && typeof entry === 'object' && typeof entry.baseline === 'number' ? entry.baseline : null;
    const actual = actualCounts[m] || 0;
    const matched = window.GymVolumeLogic.matchesVolumeDecision(action, baseline, actual);
    return { muscle: m, action, baseline, actual, matched };
  });

  const cardioCount = countEntriesInWeek((health && health['health:cardio']) || [], monday, sunday);
  const posingCount = countEntriesInWeek((posing && posing['posing:log']) || [], monday, sunday);
  const cardioRx = rxInfo(decision.details && decision.details.cardio_rx, cardioCount);
  const posingRx = rxInfo(decision.details && decision.details.posing_rx, posingCount);

  return { volumeRows, cardioCount, posingCount, cardioRx, posingRx, weekLabel: monday + ' to ' + sunday };
}

const VERDICT_BADGE = {
  matched: `<span style="color:var(--good);">✓ matched</span>`,
  partly_matched: `<span style="color:var(--warn);">~ partly matched</span>`,
  not_matched: `<span style="color:var(--bad);">✗ not matched</span>`,
};

function rxRowHtml(label, count, rx) {
  const targetLabel = rx.target != null ? ` / ${rx.target} target` : (rx.legacyText ? ` (legacy: "${rx.legacyText}")` : '');
  const badge = rx.verdict ? VERDICT_BADGE[rx.verdict] : '';
  return `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
    <span style="color:var(--text-1);">${label} sessions logged</span>
    <span style="color:var(--text-2);">${count}${targetLabel} ${badge}</span>
  </div>`;
}

function renderScorecard(scorecard) {
  const volumeHtml = scorecard.volumeRows.length
    ? scorecard.volumeRows.map(r => {
        const known = window.GymVolumeLogic.VOLUME_ACTIONS[r.action];
        const dirLabel = known ? known.label : 'unrecognized';
        const baselineLabel = r.baseline != null ? r.baseline : '?';
        const badge = r.matched === null ? '' : r.matched
          ? `<span style="color:var(--good);">✓ followed</span>`
          : `<span style="color:var(--bad);">✗ not followed</span>`;
        return `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;">
          <span style="color:var(--text-1);">${r.muscle} — decided "${dirLabel}"</span>
          <span style="color:var(--text-2);">${r.actual} vs ${baselineLabel} last week ${badge}</span>
        </div>`;
      }).join('')
    : `<p style="color:var(--text-3);font-size:13px;">No volume decisions recorded.</p>`;

  return `
    <div style="background:rgba(110,231,183,0.05);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;">
      <p style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 8px;">Follow-through — week of ${scorecard.weekLabel}</p>
      ${volumeHtml}
      ${rxRowHtml('Cardio', scorecard.cardioCount, scorecard.cardioRx)}
      ${rxRowHtml('Posing', scorecard.posingCount, scorecard.posingRx)}
      <p style="color:var(--text-3);font-size:11px;margin:8px 0 0;">Anchor-lift and pain calls still need your own read — pick a verdict for each below.</p>
    </div>`;
}

// Normalizes anchor_lifts/pain_flags into a uniform {key, label, legacy}
// shape for the manual-verdict UI below. `key` is `field.index`, used to
// route a select's value back into decision.details on save. Legacy rows
// (recorded before this structured payload existed -- a bare string for
// anchor_lifts, or an array of bare strings for pain_flags) render as
// plain text with no verdict picker, since there's nothing to score.
function normalizeAnchorLifts(raw) {
  if (Array.isArray(raw)) return raw.map((e, i) => ({
    key: 'anchor_lifts.' + i,
    label: `${e.lift} — ${e.call}${e.guardrail ? ' (guardrail: ' + e.guardrail + ')' : ''}`,
  }));
  if (raw) return [{ key: null, label: raw }];
  return [];
}

function normalizePainFlags(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map((e, i) => e && typeof e === 'object'
    ? { key: 'pain_flags.' + i, label: `${e.note}${e.guardrail ? ' (guardrail: ' + e.guardrail + ')' : ''}` }
    : { key: null, label: e });
}

function manualVerdictRowsHtml(title, items) {
  if (!items.length) return '';
  const rows = items.map(it => it.key
    ? `<div style="padding:4px 0;">
        <div style="font-size:13px;color:var(--text-1);margin-bottom:4px;">${it.label}</div>
        <select class="manualVerdict" data-key="${it.key}" style="width:100%;padding:6px;">
          <option value="">Verdict...</option>
          <option value="matched">Matched</option>
          <option value="partly_matched">Partly matched</option>
          <option value="not_matched">Not matched</option>
        </select>
      </div>`
    : `<div style="padding:4px 0;font-size:13px;color:var(--text-2);">${it.label} <span style="color:var(--text-3);">(legacy — no verdict needed)</span></div>`
  ).join('');
  return `<div style="margin:8px 0;"><p style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 4px;">${title}</p>${rows}</div>`;
}

async function renderCloseout(decision) {
  const el = document.getElementById('closeoutSection');
  el.style.display = 'block';
  el.innerHTML = `<p style="color:var(--text-3);font-size:13px;">Scoring last week's follow-through...</p>`;

  // Never let a failed scorecard fetch (offline, flaky wifi -- plausible for
  // a gym app) leave Carl stuck on "Scoring..." with no way to close out the
  // open decision (found in code review 2026-08-17). The verdict picker is
  // the invariant that must always render; the scorecard is a bonus on top.
  let scorecardHtml = '';
  let scorecard = null;
  try {
    scorecard = await computeScorecard(decision);
    scorecardHtml = renderScorecard(scorecard);
  } catch (err) {
    console.error('computeScorecard failed:', err);
    scorecardHtml = `<p style="color:var(--warn);font-size:13px;margin-bottom:12px;">Couldn't load follow-through data (connection issue) — pick a verdict from memory.</p>`;
  }

  const anchorItems = normalizeAnchorLifts(decision.details && decision.details.anchor_lifts);
  const painItems = normalizePainFlags(decision.details && decision.details.pain_flags);

  el.innerHTML = `
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;">
      <p style="color:var(--text-2);font-size:13px;">Close out last week's decision before starting a new one:</p>
      <p style="color:var(--text-1);font-size:14px;margin:8px 0;">${decision.decision_text}</p>
      ${scorecardHtml}
      ${manualVerdictRowsHtml('Anchor lifts', anchorItems)}
      ${manualVerdictRowsHtml('Pain / recovery', painItems)}
      <p style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 4px;">Coach's response this week (optional)</p>
      <select id="coachStatusSelect" style="width:100%;padding:8px;margin-bottom:6px;">
        <option value="">No status...</option>
        <option value="approved">Approved</option>
        <option value="modified">Modified</option>
        <option value="hold">Hold</option>
        <option value="needs_more_data">Needs more data</option>
      </select>
      <textarea id="coachNoteText" placeholder="What did your coach actually say?" style="width:100%;padding:8px;min-height:50px;margin-bottom:8px;"></textarea>
      <select id="verdictSelect" style="width:100%;padding:8px;margin-bottom:8px;">
        <option value="">Verdict...</option>
        <option value="worked">Worked</option>
        <option value="partly_worked">Partly worked</option>
        <option value="wrong">Wrong</option>
        <option value="inconclusive">Inconclusive</option>
      </select>
      <textarea id="outcomeNote" placeholder="What actually happened?" style="width:100%;padding:8px;min-height:60px;margin-bottom:8px;"></textarea>
      <button id="closeoutSave" style="padding:10px 16px;">Save & Continue</button>
    </div>`;
  document.getElementById('closeoutSave').onclick = async () => {
    const verdict = document.getElementById('verdictSelect').value;
    if (!verdict) { alert('Pick a verdict first.'); return; }
    const manualSelects = Array.from(document.querySelectorAll('.manualVerdict'));
    if (manualSelects.some(sel => !sel.value)) { alert('Pick a verdict for every anchor-lift/pain entry.'); return; }
    const note = document.getElementById('outcomeNote').value;

    const details = JSON.parse(JSON.stringify(decision.details || {}));
    manualSelects.forEach(sel => {
      const [field, idx] = sel.dataset.key.split('.');
      if (details[field] && details[field][idx]) details[field][idx].verdict = sel.value;
    });
    if (scorecard && scorecard.cardioRx.verdict && details.cardio_rx) details.cardio_rx.verdict = scorecard.cardioRx.verdict;
    if (scorecard && scorecard.posingRx.verdict && details.posing_rx) details.posing_rx.verdict = scorecard.posingRx.verdict;

    const coachResponse = buildCoachResponse(document.getElementById('coachStatusSelect').value, document.getElementById('coachNoteText').value);
    if (coachResponse) details.coach_response = coachResponse;
    else delete details.coach_response;

    await window.closeDecision(decision.id, verdict, note, details);
    el.style.display = 'none';
    await renderNewDecisionForm();
  };
}

// <option> values/order sourced from the single VOLUME_ACTIONS map
// (gym-volume-logic.js) instead of a 3rd independent hardcoded copy --
// display text just title-cases the same label matchesVolumeDecision's
// comparator and the closeout scorecard's dirLabel both already use.
function volumeActionOptions(suggested) {
  return ['add_set', 'keep', 'pull_back'].map(action => {
    const label = window.GymVolumeLogic.VOLUME_ACTIONS[action].label;
    const text = label.charAt(0).toUpperCase() + label.slice(1);
    return `<option value="${action}" ${suggested === action ? 'selected' : ''}>${text}</option>`;
  }).join('');
}

function anchorLiftRowHtml() {
  return `<div class="anchorLiftRow" style="display:flex;gap:6px;margin-top:6px;">
    <input type="text" class="anchorLiftName" placeholder="Lift" style="flex:2;padding:6px;">
    <select class="anchorLiftCall" style="flex:1;padding:6px;">
      <option value="progress">Progress</option>
      <option value="hold">Hold</option>
      <option value="regress">Regress</option>
    </select>
    <input type="text" class="anchorLiftGuardrail" placeholder="Guardrail (optional)" style="flex:2;padding:6px;">
  </div>`;
}

async function renderNewDecisionForm() {
  const [gymState, coachRead] = await Promise.all([fetchGymState(), fetchCoachRead()]);
  const counts = window.GymVolumeLogic.weeklySetsByMuscle(gymState.exercises || [], gymState.logs || {});
  const phase = coachRead && coachRead.phase;

  const muscleRows = MUSCLES.map(m => {
    const band = window.GymVolumeLogic.classifyMuscleVolume(m, counts[m] || 0, phase);
    const advisory = window.GymVolumeLogic.volumeAdvisory(band, false, phase);
    const suggested = advisory ? advisory.suggestion : 'keep';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);">
      <span style="color:var(--text-1);font-size:13px;">${m} (${counts[m] || 0} sets)</span>
      <select data-muscle="${m}" class="muscleSelect" style="padding:4px;">${volumeActionOptions(suggested)}</select>
    </div>`;
  }).join('');

  const el = document.getElementById('newDecisionSection');
  el.style.display = 'block';
  el.innerHTML = `
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:16px;">
      ${coachRead ? `<p style="color:var(--text-2);font-size:13px;">${coachRead.narrative}</p>` : `<p style="color:var(--text-3);font-size:13px;">Signal narrative unavailable this week.</p>`}
      <h3 style="color:var(--text-1);font-size:14px;margin-top:12px;">Volume by muscle</h3>
      ${muscleRows}
      <h3 style="color:var(--text-1);font-size:14px;margin-top:12px;">Anchor lifts</h3>
      <div id="anchorLiftRows">${anchorLiftRowHtml()}</div>
      <button type="button" id="addAnchorLift" style="padding:6px 12px;font-size:12px;margin-top:6px;">+ Add lift</button>

      <h3 style="color:var(--text-1);font-size:14px;margin-top:12px;">Cardio</h3>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <input type="number" id="cardioTarget" placeholder="Target sessions/wk" style="flex:1;padding:8px;">
        <input type="text" id="cardioGuardrail" placeholder="Guardrail (optional)" style="flex:2;padding:8px;">
      </div>

      <h3 style="color:var(--text-1);font-size:14px;margin-top:12px;">Posing</h3>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <input type="number" id="posingTarget" placeholder="Target sessions/wk" style="flex:1;padding:8px;">
        <input type="text" id="posingGuardrail" placeholder="Guardrail (optional)" style="flex:2;padding:8px;">
      </div>

      <label style="display:block;color:var(--text-2);font-size:13px;margin-top:12px;">
        <input type="checkbox" id="painFlag" /> Recovery/pain flag
      </label>
      <textarea id="painNote" placeholder="Pain/recovery note" style="width:100%;padding:8px;margin-top:4px;min-height:40px;"></textarea>
      <input type="text" id="painGuardrail" placeholder="Guardrail (optional)" style="width:100%;padding:8px;margin-top:4px;">
      <textarea id="rationale" placeholder="Rationale" style="width:100%;padding:8px;margin-top:8px;min-height:50px;"></textarea>
      <button id="saveDecision" style="padding:10px 16px;margin-top:8px;">Save This Week's Decision</button>
    </div>`;

  document.getElementById('addAnchorLift').onclick = () => {
    document.getElementById('anchorLiftRows').insertAdjacentHTML('beforeend', anchorLiftRowHtml());
  };

  document.getElementById('saveDecision').onclick = async () => {
    // Store the baseline count alongside each muscle's chosen action, not
    // just the action string — the closeout scorecard needs an exact
    // "actual vs baseline" number, and re-deriving that later from
    // decision.created_at's week would be more fragile than just keeping
    // the count `counts` already computed above.
    const muscleGroups = {};
    document.querySelectorAll('.muscleSelect').forEach(sel => {
      muscleGroups[sel.dataset.muscle] = { action: sel.value, baseline: counts[sel.dataset.muscle] || 0 };
    });
    const anchorLifts = Array.from(document.querySelectorAll('.anchorLiftRow'))
      .map(row => ({
        lift: row.querySelector('.anchorLiftName').value.trim(),
        call: row.querySelector('.anchorLiftCall').value,
        guardrail: row.querySelector('.anchorLiftGuardrail').value.trim() || null,
      }))
      .filter(e => e.lift);
    const cardioTarget = document.getElementById('cardioTarget').value;
    const posingTarget = document.getElementById('posingTarget').value;
    const painNote = document.getElementById('painNote').value;

    const reviewDate = new Date();
    reviewDate.setDate(reviewDate.getDate() + 7);
    const summary = 'Week of ' + new Date().toISOString().slice(0, 10) + ' coach decision recorded.';
    await window.recordDecision({
      category: 'weekly-coach-loop',
      decision_text: summary,
      rationale: document.getElementById('rationale').value,
      review_date: reviewDate.toISOString().slice(0, 10),
      details: {
        muscle_groups: muscleGroups,
        anchor_lifts: anchorLifts,
        cardio_rx: { target: cardioTarget ? Number(cardioTarget) : null, guardrail: document.getElementById('cardioGuardrail').value.trim() || null },
        posing_rx: { target: posingTarget ? Number(posingTarget) : null, guardrail: document.getElementById('posingGuardrail').value.trim() || null },
        pain_flags: document.getElementById('painFlag').checked ? [{ note: painNote, guardrail: document.getElementById('painGuardrail').value.trim() || null }] : [],
      },
    });
    alert('Saved.');
    location.reload();
  };
}

// Prep Readiness Panel -- phase-aware guardrail view, not a peak-week
// engine. See docs/superpowers/specs/2026-08-19-prep-readiness-panel-design.md.
const RECOVERY_SCORE = { low: 1, med: 2, high: 3 };
const TREND_ARROW = { up: '↑', down: '↓', flat: '→' };

async function renderReadinessPanel() {
  const el = document.getElementById('readinessSection');
  const [gymState, existingDecision] = await Promise.all([
    fetchGymState(),
    window.getOpenDueDecision('weekly-coach-loop'),
  ]);

  const phase = gymState.season && gymState.season.phase;
  const phaseLabel = phase ? window.GymSeasonLogic.PHASES[phase] : null;
  const day = phase && gymState.season.startDate ? window.GymSeasonLogic.daysSince(gymState.season.startDate) : null;

  const counts = window.GymVolumeLogic.weeklySetsByMuscle(gymState.exercises || [], gymState.logs || {});
  const flaggedMuscles = [];
  const volumeHtml = MUSCLES.map(m => {
    const band = window.GymVolumeLogic.classifyMuscleVolume(m, counts[m] || 0, phase);
    if (!band) return '';
    // Flags both directions volumeAdvisory() would -- below the phase
    // target (belowTarget) AND at/above MRV (band.label === 'mrv'), not
    // just the under-volume case. An over-volume muscle is the
    // highest-priority flag in the whole autopsy/advisory system
    // (gym-volume-logic.js's priority:3); the guardrail panel silently
    // missing it defeated the panel's own purpose (code review finding,
    // 2026-08-19).
    if (band.label === 'mrv') {
      flaggedMuscles.push(m);
      return `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;">
        <span style="color:var(--text-2);">${m}</span>
        <span style="color:var(--bad);">${counts[m] || 0} — at/above MRV (${band.mrv})</span>
      </div>`;
    }
    if (!band.belowTarget) return '';
    flaggedMuscles.push(m);
    return `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;">
      <span style="color:var(--text-2);">${m}</span>
      <span style="color:var(--warn);">${counts[m] || 0} / ${band.target} target</span>
    </div>`;
  }).join('');

  const { monday, sunday } = weekWindow(easternCalendarDate(new Date()));
  const trend = window.GymReadinessLogic.recoveryTrend(gymState.checkins || {}, sunday, RECOVERY_SCORE);
  const trendHtml = trend.direction
    ? `<span style="color:var(--text-1);">${trend.avgLast7.toFixed(1)}/3 ${TREND_ARROW[trend.direction]}</span>`
    : `<span style="color:var(--text-3);">No recovery data logged this week</span>`;

  const [health, posing, foodLogWeek] = await Promise.all([fetchAppStateKey('health'), fetchAppStateKey('posing'), fetchFoodLogWeek(monday, sunday)]);
  const cardioCount = countEntriesInWeek((health && health['health:cardio']) || [], monday, sunday);
  const posingCount = countEntriesInWeek((posing && posing['posing:log']) || [], monday, sunday);

  // coachSnapshot phase-aware weekly verdict -- see
  // docs/superpowers/specs/2026-08-20-coachsnapshot-phase-verdict-design.md.
  // cardio/posing reuse the same Rx-target concept computeScorecard() uses
  // (the open due decision's details) -- no target set -> null signal,
  // same null-handling as everywhere else on this page.
  const cardioRxTarget = existingDecision && existingDecision.details && existingDecision.details.cardio_rx && existingDecision.details.cardio_rx.target;
  const posingRxTarget = existingDecision && existingDecision.details && existingDecision.details.posing_rx && existingDecision.details.posing_rx.target;
  const weekSleepEntries = ((health && health['health:sleep']) || []).filter(e => e && e.date && e.date >= monday && e.date <= sunday);
  const macroTargets = health && health['macro_targets'];
  const macroDayResults = macroTargets
    ? Array.from(new Set(foodLogWeek.map(r => r.log_date))).map(day => {
        const dayRows = foodLogWeek.filter(r => r.log_date === day);
        const { consumed } = window.MacroCalc.remainingBudget(macroTargets, dayRows);
        return window.MacroCalc.isPoorMacroAdherence(consumed, macroTargets);
      })
    : [];
  const weightSeries = (gymState.weights || []).map(w => ({ date: w.dateKey, value: w.weight }));
  const waistSeries = ((health && health['health:measurements']) || []).filter(e => e && e.waist != null).map(e => ({ date: e.date, value: e.waist }));
  const currentWeight = weightSeries.length ? weightSeries.slice().sort((a, b) => a.date.localeCompare(b.date)).slice(-1)[0].value : null;
  const recompResult = window.RecompSignalLogic.computeRecompDelta(weightSeries, waistSeries, 14, new Date());
  // The MOST RECENT checkin in the week window, not "any high-pain day this
  // week" -- an early-week high-pain flag that's since resolved shouldn't
  // keep overriding a verdict that's otherwise back on track (code review
  // finding, 2026-08-20).
  const weekCheckinDates = Object.keys(gymState.checkins || {}).filter(dateKey => dateKey >= monday && dateKey <= sunday).sort();
  const latestWeekCheckinDate = weekCheckinDates[weekCheckinDates.length - 1];
  const weekPainHigh = !!(latestWeekCheckinDate && gymState.checkins[latestWeekCheckinDate] && gymState.checkins[latestWeekCheckinDate].pain === 'high');

  const snapshotSignals = {
    cardio: window.CoachSnapshotLogic.scoreCountSignal(matchesCountTarget(cardioRxTarget, cardioCount)),
    posing: window.CoachSnapshotLogic.scoreCountSignal(matchesCountTarget(posingRxTarget, posingCount)),
    sleep: window.CoachSnapshotLogic.scoreSleepSignal(weekSleepEntries, window.GymSleepCheckLogic.isPoorSleepEntry),
    macro: window.CoachSnapshotLogic.scoreMacroSignal(macroDayResults),
    bodyweight: window.CoachSnapshotLogic.scoreBodyweightSignal(recompResult, currentWeight, phase),
  };
  const snapshotVerdict = window.CoachSnapshotLogic.computeVerdict(snapshotSignals, phase, weekPainHigh);
  const SIGNAL_LABEL = { cardio: 'cardio', posing: 'posing', sleep: 'sleep', macro: 'macro adherence', bodyweight: 'bodyweight trend' };
  const VERDICT_DISPLAY = {
    on_track: { text: 'On track', color: 'var(--good)' },
    needs_attention: { text: 'Needs attention', color: 'var(--warn)' },
    off_track: { text: 'Off track', color: 'var(--bad)' },
    not_enough_data: { text: 'Not enough data yet', color: 'var(--text-3)' },
  };
  const verdictDisplay = VERDICT_DISPLAY[snapshotVerdict.verdict];
  const offSignalsText = snapshotVerdict.reason === 'pain_override'
    ? 'pain flagged'
    : (snapshotVerdict.offSignals || []).map(k => SIGNAL_LABEL[k]).join(', ');
  const verdictHtml = `<div style="font-size:16px;font-weight:600;color:${verdictDisplay.color};margin-bottom:4px;">
    ${verdictDisplay.text}${offSignalsText ? ' — ' + offSignalsText : ''}
  </div>`;

  const readinessList = (posing && posing['posing:readiness']) || [];
  const latestReadiness = window.ReadinessIndexLogic.latestCheckin(readinessList);
  let readinessIndexHtml = '';
  if (latestReadiness) {
    const sorted = readinessList.slice().sort((a, b) => a.date.localeCompare(b.date));
    const currentAvg = window.ReadinessIndexLogic.averageScore(latestReadiness);
    const prevAvg = sorted.length > 1 ? window.ReadinessIndexLogic.averageScore(sorted[sorted.length - 2]) : null;
    const readinessTrend = window.ReadinessIndexLogic.trend(currentAvg, prevAvg);
    const age = window.ReadinessIndexLogic.daysSince(latestReadiness.date, new Date().toISOString().slice(0, 10));
    readinessIndexHtml = `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;">
      <span style="color:var(--text-1);">Judge's-eye readiness</span>
      <span style="color:var(--text-2);">${currentAvg != null ? currentAvg.toFixed(1) + '/5' : '—'}${readinessTrend ? ' ' + TREND_ARROW[readinessTrend] : ''} — checked in ${age}d ago</span>
    </div>`;
  }

  const exceptions = window.GymReadinessLogic.mobilityExceptionsInWeek(gymState.jointPain || [], monday, sunday);
  const exceptionsHtml = exceptions.length
    ? exceptions.map(e => `<div style="font-size:12px;color:var(--warn);padding:2px 0;">${e.joint} — ${e.severity} (${e.date})</div>`).join('')
    : `<div style="font-size:12px;color:var(--text-3);">None logged this week</div>`;

  const peakBanner = phase === 'peak'
    ? `<div style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px;color:var(--warn);">Holding — no autonomous changes.</div>`
    : '';

  // Items 6/9/10 -- related vault notes, pattern findings, weekly coach
  // packet. All purely additive: any failure below (missing script,
  // unreachable index, bad data shape) just means these sections render
  // empty. Never touches gymState/logging.
  const queryTags = [phase].concat(flaggedMuscles).filter(Boolean);
  let vaultIndex = null;
  try {
    const res = await fetch('vault-training-index.json');
    if (res.ok) vaultIndex = await res.json();
  } catch (e) { vaultIndex = null; }

  let notesHtml = '';
  try {
    if (queryTags.length && window.TrainingContextSelector && vaultIndex) {
      const notes = window.TrainingContextSelector.selectNotes(vaultIndex, queryTags, new Date());
      if (notes.length) {
        notesHtml = `<p style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 4px;">Related notes</p>` +
          notes.map(n => `<div style="padding:3px 0;font-size:12px;">
            <span style="color:var(--text-1);">${n.title}</span>
            <span style="color:var(--text-3);"> — ${n.reason}${n.freshness === 'stale' ? ' (stale)' : ''}</span>
          </div>`).join('');
      }
    }
  } catch (e) {
    notesHtml = '';
  }

  let findingsHtml = '';
  let weeklyPacketMarkdown = '';
  try {
    if (window.TrainingInsightEngine && window.GymWorkoutEvents && window.WeeklyCoachPacket) {
      const exercisesById = {};
      (gymState.exercises || []).forEach(ex => { exercisesById[ex.id] = ex; });
      const exposuresByName = {};
      Object.keys(gymState.logs || {}).forEach(exId => {
        const ex = exercisesById[exId];
        if (!ex) return;
        const entries = (gymState.logs[exId] || []).map(l => ({
          date: (l.date || '').slice(0, 10),
          load: ex.bw ? l.reps : window.GymWorkoutEvents.totalLoad(l, ex),
          reps: l.reps,
          variantTag: l.variant || null,
        })).filter(e => e.date && e.load != null);
        if (entries.length) exposuresByName[ex.name] = entries;
      });
      const allEntries = Object.values(gymState.logs || {}).flat();
      const sessionDates = Array.from(new Set(allEntries.map(l => (l.date || '').slice(0, 10)).filter(Boolean)));

      // Trailing 6 calendar weeks (Mon-Sun, UTC) of total logged sets.
      const nowRef = new Date();
      const dow = nowRef.getUTCDay() === 0 ? 7 : nowRef.getUTCDay(); // Mon=1..Sun=7
      const thisMonday = new Date(nowRef); thisMonday.setUTCDate(nowRef.getUTCDate() - (dow - 1));
      const weeklySets = [];
      for (let w = 5; w >= 0; w--) {
        const wkMonday = new Date(thisMonday); wkMonday.setUTCDate(thisMonday.getUTCDate() - w * 7);
        const wkSunday = new Date(wkMonday); wkSunday.setUTCDate(wkMonday.getUTCDate() + 6);
        const mKey = wkMonday.toISOString().slice(0, 10), sKey = wkSunday.toISOString().slice(0, 10);
        weeklySets.push(allEntries.filter(l => { const d = (l.date || '').slice(0, 10); return d >= mKey && d <= sKey; }).length);
      }

      const allSleepEntries = ((health && health['health:sleep']) || []).filter(e => e && e.date && e.hours != null);

      const findings = window.TrainingInsightEngine.runInsightEngine({
        exercises: exposuresByName,
        sessionDates: sessionDates,
        weeklySets: weeklySets,
        phase: phase,
        sleepEntries: allSleepEntries,
        now: nowRef,
      });

      if (findings.length) {
        findingsHtml = `<p style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 4px;">Pattern findings</p>` +
          findings.map(f => `<div style="padding:4px 0;font-size:12px;">
            <span style="color:var(--text-1);">${f.observation}</span>
            <span style="color:var(--text-3);"> (${f.confidence} confidence)</span>
          </div>`).join('');
      }

      const relatedNotes = (window.TrainingContextSelector && queryTags.length && vaultIndex)
        ? window.TrainingContextSelector.selectNotes(vaultIndex, queryTags, nowRef)
        : [];
      weeklyPacketMarkdown = window.WeeklyCoachPacket.buildWeeklyCoachPacket({
        weekLabel: `${monday} to ${sunday}`,
        summary: { sessionsLogged: sessionDates.filter(d => d >= monday && d <= sunday).length, totalSets: weeklySets[weeklySets.length - 1], exercisesTouched: Object.keys(exposuresByName).length },
        adherence: { macroDaysLogged: macroDayResults.length, sleepNightsLogged: weekSleepEntries.length, cardioSessions: cardioCount },
        findings: findings,
        notes: relatedNotes,
        missingData: findings.length ? [] : ['Not enough logged history yet for pattern findings (engine requires 4+ exposures per exercise or 14+ sleep nights).'],
      });
    }
  } catch (e) {
    findingsHtml = '';
    weeklyPacketMarkdown = '';
  }
  const packetHtml = weeklyPacketMarkdown
    ? `<details style="margin-top:8px;"><summary style="font-size:12px;color:var(--text-2);cursor:pointer;">Weekly coach packet (Markdown)</summary><textarea readonly style="width:100%;height:160px;margin-top:6px;font-size:11px;font-family:monospace;background:var(--bg);color:var(--text-2);border:1px solid var(--border);border-radius:6px;padding:6px;">${weeklyPacketMarkdown.replace(/</g, '&lt;')}</textarea></details>`
    : '';

  const decisionFlagHtml = existingDecision
    ? `<div style="font-size:13px;color:var(--warn);padding:6px 0;">Needs coach decision — last week's is open and due.</div>`
    : '';

  el.style.display = 'block';
  el.innerHTML = `
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;">
      ${verdictHtml}
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <span style="font-size:15px;color:var(--text-1);font-weight:600;">${phaseLabel || 'No season set'}</span>
        ${day != null ? `<span style="font-size:12px;color:var(--text-3);">Day ${day}</span>` : ''}
      </div>
      ${peakBanner}
      ${volumeHtml ? `<p style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 4px;">Volume flags</p>${volumeHtml}` : ''}
      <p style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 4px;">Recovery trend (7-day)</p>
      ${trendHtml}
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;margin-top:8px;">
        <span style="color:var(--text-1);">Cardio / posing this week</span>
        <span style="color:var(--text-2);">${cardioCount} / ${posingCount}</span>
      </div>
      ${readinessIndexHtml}
      ${existingDecision && existingDecision.details && (hasRx(existingDecision.details.cardio_rx) || hasRx(existingDecision.details.posing_rx)) ? `
      <div style="font-size:12px;color:var(--text-3);padding:2px 0;">
        ${hasRx(existingDecision.details.cardio_rx) ? `Cardio Rx: ${rxSummaryText(existingDecision.details.cardio_rx)}` : ''}
        ${hasRx(existingDecision.details.posing_rx) ? `<br>Posing Rx: ${rxSummaryText(existingDecision.details.posing_rx)}` : ''}
      </div>` : ''}
      <p style="color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 4px;">Mobility exceptions</p>
      ${exceptionsHtml}
      ${notesHtml}
      ${findingsHtml}
      ${packetHtml}
      ${decisionFlagHtml}
    </div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  const existing = await window.getOpenDueDecision('weekly-coach-loop');
  document.getElementById('loading').style.display = 'none';
  renderReadinessPanel();
  if (existing) {
    renderCloseout(existing);
  } else {
    renderNewDecisionForm();
  }
});
</script>
</body>
</html>
