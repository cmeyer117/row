name: Macro Drift Nudge

on:
  schedule:
    # ~8pm Central (accounting for DST drift, see workout-nudge.yml) = 1am UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Send macro drift nudge
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://row-sage.vercel.app/api/send-macro-drift-nudge \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response code: $response"
          if [ "$response" != "200" ]; then
            echo "Error: unexpected response $response"
            exit 1
          fi
