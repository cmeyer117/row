.fc-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 700; font-family: inherit; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }

<script>
// History logging — fire-and-forget capture of each completed session so
// Carl can judge scoring accuracy across real sessions later. No read path,
// no UI here on purpose (see docs/superpowers/specs/
// 2026-08-06-form-coach-history-logging-design.md) -- capture only. A
// failed write never surfaces to the user; the on-screen result (which the
// user already sees) is the primary feature, this is optional data capture
// riding alongside it. Same shared Supabase project as gym.html/posing.html,
// its own client since this page intentionally doesn't touch gym.html's
// sync machinery.
(function () {
  var FC_SUPABASE_URL = window.SUPABASE_CONFIG.URL;
  var FC_SUPABASE_KEY = window.SUPABASE_CONFIG.KEY;
  var FC_HISTORY_KEY = 'row:form-coach-history';
  var fcSupa = null;

  function getFcSupa() {
    if (!fcSupa && window.supabase) fcSupa = window.supabase.createClient(FC_SUPABASE_URL, FC_SUPABASE_KEY);
    return fcSupa;
  }

  window.FormCoachHistory = {
    logSession: function (type, data) {
      var supa = getFcSupa();
      if (!supa) return;
      var record = window.FormCoachLogic.buildHistoryRecord(type, data);
      if (!record) return;
      supa.from('app_state').select('data').eq('key', FC_HISTORY_KEY).maybeSingle()
        .then(function (res) {
          var sessions = (res.data && res.data.data && Array.isArray(res.data.data.sessions)) ? res.data.data.sessions : [];
          sessions.push(record);
          return supa.from('app_state').upsert(
            { key: FC_HISTORY_KEY, data: { sessions: sessions }, updated_at: new Date().toISOString() },
            { onConflict: 'key' }
          );
        })
        .then(function (res) {
          if (res && res.error) console.warn('[form-coach-history] write failed:', res.error.message);
        })
        .catch(function (err) {
          console.warn('[form-coach-history] write threw:', err && err.message);
        });
    }
  };
})();
</script>
<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

// Single-camera module (2026-08-25 Coach tab split) -- this page now owns
// only the lift camera (posing moved to posing.html), so the old mode-keyed
// FormCoachCamera is replaced with an unkeyed equivalent. Same
// stop-before-start discipline as before (730d13d), now triggered by
// postMessage from the parent coach.html frame instead of a same-page tab
// click.
var LiftCamera = { landmarker: null, landmarkerPromise: null, stream: null, ready: false, error: null, cancelLoop: null };

function loadLandmarker(statusEl) {
  if (!LiftCamera.landmarkerPromise) {
    LiftCamera.landmarkerPromise = (async function () {
      try {
        var vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );
        LiftCamera.landmarker = await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 1
        });
        return true;
      } catch (err) {
        LiftCamera.error = 'model-load-failed';
        if (statusEl) { statusEl.textContent = 'Pose detection failed to load — check your connection and reload.'; statusEl.classList.add('bad'); }
        return false;
      }
    })();
  }
  return LiftCamera.landmarkerPromise;
}

async function initCamera(videoEl, statusEl) {
  var modelOk = await loadLandmarker(statusEl);
  if (!modelOk) return false;
  try {
    LiftCamera.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
  } catch (err) {
    LiftCamera.error = 'camera-denied';
    if (statusEl) { statusEl.textContent = 'Camera access denied. Allow camera access in your browser settings, then reload.'; statusEl.classList.add('bad'); }
    return false;
  }
  LiftCamera.ready = true;
  videoEl.srcObject = LiftCamera.stream;
  await new Promise(function (resolve) { videoEl.onloadedmetadata = resolve; });
  if (statusEl) { statusEl.textContent = ''; statusEl.classList.remove('bad', 'warn'); }
  return true;
}

function stopCamera(videoEl) {
  if (LiftCamera.stream) {
    LiftCamera.stream.getTracks().forEach(function (t) { t.stop(); });
    LiftCamera.stream = null;
  }
  if (videoEl) videoEl.srcObject = null;
  LiftCamera.ready = false;
  if (LiftCamera.cancelLoop) { LiftCamera.cancelLoop(); LiftCamera.cancelLoop = null; }
}

function startDetectionLoop(videoEl, onResult, intervalMs, isActiveFn) {
  var lastRun = 0;
  var cancelled = false;
  function tick(nowMs) {
    if (cancelled) return;
    if (isActiveFn() && LiftCamera.ready && LiftCamera.landmarker && nowMs - lastRun >= intervalMs) {
      lastRun = nowMs;
      var result = LiftCamera.landmarker.detectForVideo(videoEl, performance.now());
      var landmarks = (result.landmarks && result.landmarks.length) ? result.landmarks[0] : null;
      onResult(landmarks, nowMs);
    }
    requestAnimationFrame(tick);
  }
  LiftCamera.cancelLoop = function () { cancelled = true; };
  requestAnimationFrame(tick);
}

window.LiftCamera = LiftCamera;
window.LiftCamera.initCamera = initCamera;
window.LiftCamera.stopCamera = stopCamera;
window.LiftCamera.startDetectionLoop = startDetectionLoop;
window.dispatchEvent(new Event('lift-camera-module-ready'));
</script>
<script>
(function () {
  function escape(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  var video = document.getElementById('liftVideo');
  var statusEl = document.getElementById('liftStatus');
  var recordBtn = document.getElementById('recordSetBtn');
  var resultEl = document.getElementById('liftResult');
  var recording = false;
  var buffer = []; // [{ t, landmarks }]
  var recordingExerciseName = ''; // read at record-start, used by both the live-scoring interval and the stop branch
  var liveScoreInterval = null;
  var liveMinAmplitude = null; // frozen once calibrated, reset per recording -- see liveScoreTick

  // Form cues lookup (Coach tab split Part B, 2026-08-25) -- reuses
  // FormCoachLogic.matchBenchmark's proven fuzzy-match scoring (same
  // token-overlap algorithm benchmarks.js uses for scoring) against a
  // flattened list of every form-cues.js key, rather than duplicating a
  // second matching implementation.
  var FORM_CUE_ENTRIES = Object.keys(window.FormCues.primaries)
    .map(function (n) { return { names: [n], cueKey: n }; })
    .concat(Object.keys(window.FormCues.variants).map(function (n) { return { names: [n], cueKey: n }; }));
  var cueArea = document.getElementById('formCueArea');
  var CUE_PLACEHOLDER = 'Type an exercise name above to see setup, execution, and common mistakes.';
  var CUE_NO_MATCH = 'No form cues found for that name yet — check the spelling, or this exercise may not be in Row\'s catalog.';

  function renderPrimaryCue(entry, headingOverride) {
    var mistakesHtml = entry.mistakes.map(function (m) { return '<li>' + escape(m) + '</li>'; }).join('');
    return '<div class="fc-cue-title">' + escape(headingOverride) + '</div>' +
      '<div class="fc-cue-section"><div class="fc-cue-label">Setup</div>' + escape(entry.setup) + '</div>' +
      '<div class="fc-cue-section"><div class="fc-cue-label">Execution</div>' + escape(entry.execution) + '</div>' +
      '<div class="fc-cue-section"><div class="fc-cue-label">Common mistakes</div><ul class="fc-cue-mistakes">' + mistakesHtml + '</ul></div>' +
      (entry.benchmarkNote ? '<div class="fc-cue-section"><div class="fc-cue-label">Camera target</div>' + escape(entry.benchmarkNote) + '</div>' : '');
  }

  function renderFormCues(exerciseName) {
    var match = window.FormCoachLogic.matchBenchmark(exerciseName, FORM_CUE_ENTRIES);
    if (!match) {
      cueArea.className = 'fc-info-stub';
      cueArea.innerHTML = (exerciseName || '').trim() ? CUE_NO_MATCH : CUE_PLACEHOLDER;
      return;
    }
    var key = match.cueKey;
    cueArea.className = 'fc-cue-card';
    if (window.FormCues.primaries[key]) {
      cueArea.innerHTML = renderPrimaryCue(window.FormCues.primaries[key], key);
      return;
    }
    var variant = window.FormCues.variants[key];
    var primaryEntry = window.FormCues.primaries[variant.primary];
    cueArea.innerHTML =
      '<div class="fc-cue-title">' + escape(key) + '</div>' +
      '<div class="fc-cue-section fc-cue-variant-note"><div class="fc-cue-label">Variant of ' + escape(variant.primary) + '</div>' + escape(variant.note) + '</div>' +
      '<div class="mob-divider"></div>' +
      renderPrimaryCue(primaryEntry, 'Full form breakdown: ' + variant.primary);
  }

  document.getElementById('liftExerciseName').addEventListener('input', function (e) {
    renderFormCues(e.target.value);
  });
  // gym.html's Coach tab passes the workout's currently-active exercise as
  // ?exercise=... (via coach.html, which appends it to this iframe's src) --
  // pre-fill instead of leaving Carl to re-type a name he's already logging
  // sets against in gym.html.
  (function prefillFromActiveExercise() {
    var exerciseParam = new URLSearchParams(window.location.search).get('exercise');
    if (!exerciseParam) return;
    var input = document.getElementById('liftExerciseName');
    input.value = exerciseParam;
    renderFormCues(exerciseParam);
  })();
  var lastLandmarks = null;
  var cameraStarted = false;
  var isTabActive = false; // set true/false by the coach-tab-active/inactive postMessage handler below
  // Bumped on every activate/deactivate so a slow initCamera() that resolves
  // after a rapid switch-away-and-back can tell it's stale and self-stop
  // instead of resurrecting a camera on a tab that's no longer active
  // (Codex catch, 2026-08-25 -- the async postMessage boundary means the
  // old same-page synchronous stop-before-start ordering no longer holds).
  var activationToken = 0;
  var LIFT_LANDMARK = window.FormCoachLogic.LANDMARK;

  async function fetchLiftCritique(exercise, reps) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 25000);
    try {
      // 2026-08-12 audit fix: was a client-visible shared secret, now the
      // real owner session token -- see row-auth.js's getAccessToken().
      var token = await window.RowAuth.getAccessToken();
      var res = await fetch('/api/vision-lift-critique', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ exercise: exercise, reps: reps }),
        signal: controller.signal,
      });
      if (!res.ok) return null;
      var data = await res.json();
      return (data && typeof data.critique === 'string') ? data : null;
    } catch (err) {
      console.warn('[form-coach] lift critique fetch failed:', err && err.message);
      return null;
    } finally {
      clearTimeout(timer);
    }
  }

  function midpoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  // Picks the tracked point with the greatest y-range across the
  // buffered recording as the primary rep-segmentation axis when there's
  // no matched benchmark -- a wrist for a press pattern, a hip for a
  // squat pattern, etc. When a benchmark DID match, uses the real
  // bilateral joint angle for that exercise instead (FormCoachLogic.
  // bilateralAngle + ANGLE_TRIPLES) -- more accurate for depth-specific
  // coaching, and the same angle scoreDepth() will check against.
  // Returns { samples, range, usedBenchmark } -- usedBenchmark tells the
  // caller whether `samples` are real angle degrees (safe to depth-score
  // against `benchmark`) or the Y-position fallback (NOT comparable to a
  // degree target). Without this flag, a caller that always forwards
  // `benchmark` into scoreSet() would depth-score a raw 0-1 Y-position
  // against a degree threshold like 100 whenever the angle fallback below
  // fires -- caught in review before it shipped.
  function buildPrimarySignal(frames, benchmark) {
    if (benchmark) {
      var angleSamples = frames.map(function (f) {
        return { t: f.t, value: window.FormCoachLogic.bilateralAngle(f.landmarks, benchmark.jointAngle) };
      }).filter(function (s) { return s.value !== null; });
      if (angleSamples.length >= 10) {
        var angleValues = angleSamples.map(function (s) { return s.value; });
        return { samples: angleSamples, range: Math.max.apply(null, angleValues) - Math.min.apply(null, angleValues), usedBenchmark: true };
      }
      // Fewer than 10 valid angle frames (person partly out of frame too
      // often) -- fall through to the Y-position fallback below rather
      // than scoring a set from a mostly-missing signal.
    }
    var candidates = {
      wristAvgY: function (lm) { return (lm[LIFT_LANDMARK.L_WRIST].y + lm[LIFT_LANDMARK.R_WRIST].y) / 2; },
      hipAvgY: function (lm) { return (lm[LIFT_LANDMARK.L_HIP].y + lm[LIFT_LANDMARK.R_HIP].y) / 2; },
      kneeAvgY: function (lm) { return (lm[LIFT_LANDMARK.L_KNEE].y + lm[LIFT_LANDMARK.R_KNEE].y) / 2; }
    };
    var best = null, bestRange = -1;
    Object.keys(candidates).forEach(function (name) {
      var values = frames.map(function (f) { return candidates[name](f.landmarks); });
      var range = Math.max.apply(null, values) - Math.min.apply(null, values);
      if (range > bestRange) { bestRange = range; best = name; }
    });
    var samples = frames.map(function (f) { return { t: f.t, value: candidates[best](f.landmarks) }; });
    return { samples: samples, range: bestRange, usedBenchmark: false };
  }

  function buildStabilitySamples(frames) {
    var out = [];
    for (var i = 1; i < frames.length; i++) {
      var prevHip = midpoint(frames[i - 1].landmarks[LIFT_LANDMARK.L_HIP], frames[i - 1].landmarks[LIFT_LANDMARK.R_HIP]);
      var currHip = midpoint(frames[i].landmarks[LIFT_LANDMARK.L_HIP], frames[i].landmarks[LIFT_LANDMARK.R_HIP]);
      var dx = currHip.x - prevHip.x, dy = currHip.y - prevHip.y;
      out.push({ t: frames[i].t, jitter: Math.sqrt(dx * dx + dy * dy) });
    }
    return out;
  }

  function formatSeconds(ms) { return (ms / 1000).toFixed(1) + 's'; }

  function renderResult(scored, exerciseName) {
    if (!scored.length) {
      resultEl.innerHTML = '<div class="mob-card"><div class="mob-card-body">No clear reps detected — make sure your full body stays in frame through the whole set.</div></div>';
      return;
    }
    var rows = scored.map(function (r) {
      var flags = [];
      if (r.romFlag) flags.push('<span class="fc-rep-flag">Short ROM</span>');
      if (r.tempoFlag) flags.push('<span class="fc-rep-flag">Rushed/bounced</span>');
      if (r.stabilityFlag) flags.push('<span class="fc-rep-flag">Unstable</span>');
      var tempoStr = formatSeconds(r.eccentricMs) + ' down / ' + formatSeconds(r.concentricMs) + ' up';
      var depthStr = ('depthMet' in r) ? (' — ' + r.depthDeg + '°/target ' + r.targetDeg + '° ' + (r.depthMet ? '✓' : '✗')) : '';
      return '<div class="fc-rep-row"><span>Rep ' + r.index + ' — ' + tempoStr + depthStr + '</span><span>' + (flags.join(' ') || 'Good') + '</span></div>';
    }).join('');
    var totalTut = window.FormCoachLogic.totalTutMs(scored);
    resultEl.innerHTML = '<div class="mob-card"><div class="mob-card-body"><strong>' + escape(exerciseName || 'Set') + '</strong> — ' + scored.length + ' reps, ' + formatSeconds(totalTut) + ' total TUT</div></div><div class="mob-card">' + rows + '</div>';
  }

  function startLiftCamera() {
    var myToken = activationToken;
    window.LiftCamera.initCamera(video, statusEl).then(function (ok) {
      if (myToken !== activationToken) {
        // A newer activate/deactivate happened while this was in flight --
        // this acquisition is stale. Stop it immediately rather than
        // resurrecting a camera on a tab that's no longer active.
        if (ok) window.LiftCamera.stopCamera(video);
        return;
      }
      cameraStarted = ok;
      if (!ok) return;
      window.LiftCamera.startDetectionLoop(video, function (landmarks, nowMs) {
        lastLandmarks = landmarks;
        if (recording && landmarks) buffer.push({ t: nowMs, landmarks: landmarks });
      }, 100, function () { return isTabActive; });
    });
  }

  // Cross-frame handshake with coach.html -- see posing.html's identical
  // pattern for the full rationale (origin AND source check, child-ready
  // timing).
  window.addEventListener('message', function (event) {
    if (event.origin !== window.location.origin) return;
    if (event.source !== window.parent) return;
    if (!event.data || typeof event.data !== 'object') return;
    if (event.data.type === 'coach-tab-active') {
      activationToken++;
      isTabActive = true;
      startLiftCamera();
    } else if (event.data.type === 'coach-tab-inactive') {
      activationToken++;
      isTabActive = false;
      window.LiftCamera.stopCamera(video);
    }
  });

  window.addEventListener('lift-camera-module-ready', function () {
    if (window.parent !== window) window.parent.postMessage({ type: 'coach-child-ready' }, window.location.origin);
  });

  // Live-only render: a stripped-down version of renderResult() that omits
  // romFlag/tempoFlag/stabilityFlag (and the romPct/tempoRatio/avgJitter
  // fields they're derived from). Found during TDD verification (Node
  // trace, 2026-08-30): those fields are computed relative to the AVERAGE
  // across every rep scoreReps()/scoreStability() are given -- i.e.
  // relative to the whole set's own average, which is a moving target
  // until the set actually ends. Showing them live would mean a rep's
  // "Short ROM"/"Rushed"/"Unstable" verdict could flip after being shown,
  // as later reps shift the average. rom/durationMs/eccentricMs/
  // concentricMs/depthDeg/depthMet are NOT relative to other reps (raw
  // values, or absolute vs. a fixed benchmark target) and stay stable once
  // liveMinAmplitude is frozen -- confirmed stable via the Node trace
  // across multiple seeded-noise runs. The relative flags remain exactly
  // as they are today, shown only in renderResult() at Stop.
  function renderLiveResult(scored, exerciseName) {
    var rows = scored.map(function (r) {
      var tempoStr = formatSeconds(r.eccentricMs) + ' down / ' + formatSeconds(r.concentricMs) + ' up';
      var depthStr = ('depthMet' in r) ? (' — ' + r.depthDeg + '°/target ' + r.targetDeg + '° ' + (r.depthMet ? '✓' : '✗')) : '';
      return '<div class="fc-rep-row"><span>Rep ' + r.index + ' — ' + tempoStr + depthStr + '</span></div>';
    }).join('');
    var totalTut = window.FormCoachLogic.totalTutMs(scored);
    resultEl.innerHTML = '<div class="mob-card"><div class="mob-card-body"><strong>' + escape(exerciseName || 'Set') + '</strong> — ' + scored.length + ' rep' + (scored.length === 1 ? '' : 's') + ' so far, ' + formatSeconds(totalTut) + ' TUT</div></div><div class="mob-card">' + rows + '<div class="fc-rep-row"><span style="color:var(--text-3);font-size:12px;">Full ROM/tempo/stability flags appear when you stop the set.</span></div></div>';
  }

  function liveScoreTick() {
    // Wait for real calibration data before scoring at all -- an early
    // buffer's own observed range badly underestimates the true rep
    // range, which would freeze too-small a jitter-filter threshold
    // (found via Node trace: freezing from a 10-frame/1s sample still
    // produced unstable rep boundaries). ~4s at the 100ms detection
    // interval gives the range time to converge first.
    if (buffer.length < 40) return;
    var matchedBenchmark = window.FormCoachLogic.matchBenchmark(recordingExerciseName, window.EXERCISE_BENCHMARKS);
    var primary = buildPrimarySignal(buffer, matchedBenchmark);
    // Freeze once, per recording -- recomputing every tick (this file's
    // first draft) let the threshold drift as the buffer grew, which
    // could retroactively reinterpret earlier extrema, not just the most
    // recent rep. Reset to null at record-start (see recordBtn handler).
    // Only freeze once real movement has been observed -- if Carl clicks
    // Record but hasn't started the first rep within the calibration
    // floor (still getting set up), range is still ~0, and freezing a
    // zero threshold would disable the jitter filter for the rest of the
    // recording (found in review before push).
    //
    // FIXED (Codex review, 2026-08-30): `range > 0` alone isn't a "real
    // movement" guard -- ordinary MediaPipe landmark jitter while just
    // standing still (not yet moving) is also nonzero, and would freeze
    // an unusably tiny threshold that then reads jitter as real reps for
    // the rest of the recording. Require a range large enough that it
    // can't plausibly be jitter: angle-degree signals (a real matched
    // benchmark) need real joint ROM to exceed jitter -- 10 degrees is
    // well above typical landmark-jitter-driven angle noise (a few
    // degrees) and well below any real tracked exercise's rep ROM
    // (tens of degrees minimum). Y-position fallback signals are
    // normalized 0-1 (fraction of frame height) -- 0.03 (3% of frame
    // height) is well above typical sub-1% landmark jitter and well
    // below any real rep's movement range.
    if (liveMinAmplitude === null) {
      var MIN_REAL_RANGE = primary.usedBenchmark ? 10 : 0.03;
      if (primary.range < MIN_REAL_RANGE) return;
      liveMinAmplitude = primary.range * 0.15;
    }
    var stabilitySamples = buildStabilitySamples(buffer);
    var fullScored = window.FormCoachLogic.scoreSet(primary.samples, stabilitySamples, liveMinAmplitude, primary.usedBenchmark ? matchedBenchmark : null);
    // Hold back the most recent rep -- findExtrema's trailing extremum is
    // always "whatever's most extreme when the buffer ran out," not a
    // confirmed reversal, so the last-formed rep's end boundary can still
    // shift once more frames arrive. Every earlier rep was confirmed by a
    // real amplitude-reversal and is provably stable (Node trace).
    var confirmed = fullScored.slice(0, -1);
    if (confirmed.length) renderLiveResult(confirmed, recordingExerciseName);
  }

  recordBtn.addEventListener('click', function () {
    if (!cameraStarted) return;
    if (!recording) {
      recording = true;
      buffer = [];
      resultEl.innerHTML = '';
      recordBtn.textContent = 'Stop Recording';
      recordBtn.className = 'fc-btn fc-btn-secondary';
      recordingExerciseName = document.getElementById('liftExerciseName').value.trim();
      liveMinAmplitude = null; // recalibrate fresh for this recording
      liveScoreInterval = setInterval(liveScoreTick, 1500);
    } else {
      clearInterval(liveScoreInterval);
      liveScoreInterval = null;
      recording = false;
      recordBtn.textContent = 'Record Set';
      recordBtn.className = 'fc-btn fc-btn-primary';
      if (buffer.length < 10) {
        resultEl.innerHTML = '<div class="mob-card"><div class="mob-card-body">Recording too short — try a longer set.</div></div>';
        return;
      }
      var exerciseName = recordingExerciseName;
      var matchedBenchmark = window.FormCoachLogic.matchBenchmark(exerciseName, window.EXERCISE_BENCHMARKS);
      var primary = buildPrimarySignal(buffer, matchedBenchmark);
      var stabilitySamples = buildStabilitySamples(buffer);
      var minAmplitude = primary.range * 0.15; // 15% of the set's own observed range filters jitter without hiding a real short rep
      // Only depth-score against the benchmark when buildPrimarySignal
      // actually used angle tracking -- if it fell back to Y-position
      // (too few valid angle frames), primary.samples aren't real degrees
      // and must never be compared against a degree target.
      var scored = window.FormCoachLogic.scoreSet(primary.samples, stabilitySamples, minAmplitude, primary.usedBenchmark ? matchedBenchmark : null);
      renderResult(scored, exerciseName);
      if (scored.length) {
        resultEl.insertAdjacentHTML('beforeend', '<div class="mob-card" id="liftCritiqueCard"><div class="mob-card-body">Getting AI critique&hellip;</div></div>');
        fetchLiftCritique(exerciseName, scored).then(function (result) {
          var card = document.getElementById('liftCritiqueCard');
          if (result) {
            if (card) card.querySelector('.mob-card-body').textContent = result.critique;
            window.FormCoachHistory.logSession('lift', { exercise: exerciseName, reps: scored, liftCritique: result });
          } else {
            if (card) card.remove();
            window.FormCoachHistory.logSession('lift', { exercise: exerciseName, reps: scored });
          }
        });
      }
    }
  });
})();
</script>
</body>
</html>
