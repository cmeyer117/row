<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Row" />
<title>Coach — Row</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="row-auth.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #000000;
  --text-primary: #F4F1EA;
  --text-tertiary: rgba(184, 182, 176, 0.55);
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
main {
  position: relative; z-index: 2;
  max-width: 720px; margin: 0 auto;
  padding: 56px 20px calc(140px + env(safe-area-inset-bottom));
  padding-top: max(56px, env(safe-area-inset-top, 56px));
  padding-left: max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
}
.section-title {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin: 0 4px 14px;
}
.coach-embed { margin-top: 40px; }
.coach-embed:first-of-type { margin-top: 0; }
.coach-iframe {
  display: block; width: 100%; height: 1400px; border: 0;
  background: transparent; border-radius: 16px;
}
@media (max-width: 480px) {
  .coach-iframe { height: 1600px; }
}
</style>
</head>
<body>

<main>
  <div class="section-title">Form Coach</div>
  <section class="coach-embed">
    <iframe src="form-coach.html" class="coach-iframe" loading="lazy" title="Form Coach"></iframe>
  </section>

  <div class="section-title" style="margin-top:40px;">Posing Coach</div>
  <section class="coach-embed">
    <iframe src="posing.html" class="coach-iframe" loading="lazy" title="Posing Coach"></iframe>
  </section>
</main>

</body>
</html>
